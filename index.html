<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI: Underground — DJ Deck v2.3</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" async></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090b10;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .hidden { display: none !important; }
    button { cursor: pointer; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500 selection:text-slate-950">

  <!-- Slim Header + Status Pill -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 py-2">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 font-bold text-xs shrink-0">
          AIU
        </span>
        <h1 class="text-sm font-bold text-white truncate">DJ Deck</h1>
        <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 shrink-0">
          v2.3
        </span>
      </div>
      <div class="flex items-center gap-1.5 min-w-0">
        <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
        <span id="statusText" class="text-[11px] text-slate-300 truncate max-w-[180px] sm:max-w-xs">Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Single-Column Mobile-First Deck -->
  <main class="flex-1 max-w-xl w-full mx-auto p-2.5 sm:p-4 flex flex-col gap-3">

    <!-- 1. Compact Persistent Now Playing Deck -->
    <section class="rounded-2xl bg-slate-900/95 border border-emerald-500/40 p-3 shadow-lg">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="min-w-0">
          <p id="npTitle" class="text-sm font-bold text-white truncate">No Track Loaded</p>
          <p id="npArtist" class="text-[11px] text-slate-400 truncate">Approve a song below, then tap Next Track</p>
        </div>
        <a id="npExternalLink" href="https://suno.com" target="_blank" rel="noopener noreferrer" class="shrink-0 text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700">
          Suno ↗
        </a>
      </div>

      <!-- Persistent Suno Embed Iframe (Never touched during queue/inbox edits) -->
      <div class="relative w-full rounded-xl overflow-hidden bg-slate-950 border border-slate-800" style="min-height: 152px;">
        <div id="iframePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center p-3 text-center bg-slate-950 z-10">
          <button id="btnMountFirstTrack" type="button" class="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs shadow">
            ▶ Load First Track from Playlist
          </button>
        </div>
        <iframe
          id="sunoEmbedFrame"
          title="Suno Embedded Player"
          src="about:blank"
          class="w-full h-[152px] border-0"
          allow="autoplay; encrypted-media; fullscreen"
          loading="eager"
        ></iframe>
      </div>

      <!-- Clean Transport Bar -->
      <div class="mt-2.5 flex items-center gap-2">
        <button id="btnAdvanceNext" type="button" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-bold text-xs sm:text-sm shadow transition">
          ⏭ Next Track in Playlist
        </button>
        <button id="btnReloadCurrent" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs border border-slate-700 transition" title="Reload Current Player">
          ↻
        </button>
        <button id="btnMarkFailed" type="button" class="py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 font-semibold text-xs border border-rose-500/30 transition" title="Send to Failed">
          ⚠ Failed
        </button>
      </div>
    </section>

    <!-- 2. Streamlined Fetch & Submit Box -->
    <section class="rounded-2xl bg-slate-900/95 border border-slate-800 p-3">
      <form id="addLinkForm" class="flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <input
            id="inputSunoUrl"
            type="text"
            placeholder="Paste Suno link(s) or Discord text..."
            aria-label="Suno Song Link"
            class="flex-1 min-w-0 px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400"
          />
          <button id="btnFetchAndSubmit" type="submit" class="shrink-0 px-3.5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-bold text-xs shadow transition">
            Fetch and Submit
          </button>
        </div>
        <div class="flex items-center gap-2">
          <input
            id="inputArtistName"
            type="text"
            placeholder="Optional: @DiscordArtist or note"
            aria-label="Submitted By"
            class="flex-1 min-w-0 px-3 py-1.5 rounded-lg bg-slate-950/70 border border-slate-800 text-[11px] text-slate-200 placeholder-slate-500 focus:outline-none focus:border-slate-600"
          />
        </div>
      </form>
    </section>

    <!-- 3. Switchable Tabs: Pending Approval | Playlist | Failed -->
    <section class="rounded-2xl bg-slate-900/95 border border-slate-800 p-3 flex-1 flex flex-col gap-2.5">
      <div class="grid grid-cols-3 gap-1.5">
        <button id="tabPending" type="button" data-tab="incoming" class="queue-tab flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-bold bg-sky-500/15 text-sky-300 border border-sky-500/40 transition">
          <span class="truncate">Pending</span>
          <span id="countIncoming" class="ml-1 px-1.5 py-0.5 rounded bg-slate-950/80 text-[11px] font-mono">0</span>
        </button>
        <button id="tabPlaylist" type="button" data-tab="queued" class="queue-tab flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 text-slate-300 border border-slate-800 transition">
          <span class="truncate">Playlist</span>
          <span id="countQueued" class="ml-1 px-1.5 py-0.5 rounded bg-slate-900 text-[11px] font-mono">0</span>
        </button>
        <button id="tabFailed" type="button" data-tab="failed" class="queue-tab flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 text-slate-300 border border-slate-800 transition">
          <span class="truncate">Failed</span>
          <span id="countFailed" class="ml-1 px-1.5 py-0.5 rounded bg-slate-900 text-[11px] font-mono">0</span>
        </button>
      </div>

      <!-- Contextual Sub-Toolbar for Failed Tab -->
      <div id="failedToolbar" class="hidden flex flex-col gap-1.5 px-1 pb-2 border-b border-slate-800">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[11px] text-rose-300 font-medium">Links that failed lookup or playback</span>
          <button id="btnRetryAllFailed" type="button" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 transition">
            ↻ Retry All Failed
          </button>
        </div>
        <p class="text-[11px] text-slate-400 leading-snug">
          Manual fix: tap <strong class="text-slate-200">Open ↗</strong>, copy the <span class="font-mono text-slate-300">suno.com/song/…</span> address, paste it above. If it jumps to the Suno app, long-press Open ↗ → Open in new tab.
        </p>
      </div>

      <!-- Dynamic List Container -->
      <div id="queueListContainer" class="space-y-2 min-h-[260px] max-h-[460px] overflow-y-auto custom-scroll pr-0.5">
        <!-- Populated by JS -->
      </div>
    </section>

  </main>

  <script>
    (function () {
      const STORAGE_KEY = 'aiu_a57_dj_deck_v2';
      const CACHE_KEY = 'aiu_resolve_cache_v1';
      const DEFAULT_ARTIST = '@SunoArtist';
      const DEMO_IDS = ['trk_song_a', 'trk_song_b', 'trk_incoming_demo'];
      const UUID_SRC = '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}';
      const LOOKUP_TIMEOUT_MS = 8000;
      const RETRY_COOLDOWN_MS = 20000;

      let state = {
        activeTab: 'incoming',
        nowPlaying: null,
        lastMountedUuid: null,
        tracks: []
      };

      let resolveCache = {};
      let lookupChain = Promise.resolve();
      const pendingResolves = {};
      let transportBusy = false;

      function isShortId(id) {
        return String(id || '').indexOf('short-') === 0;
      }

      function isDemoTrack(t) {
        const id = String((t && t.id) || '');
        return DEMO_IDS.indexOf(id) !== -1 || id.indexOf('trk_song_c_') === 0;
      }

      function placeholderTitle(songUuid) {
        return isShortId(songUuid)
          ? 'Suno link · ' + String(songUuid).slice(6)
          : 'Suno track · ' + String(songUuid).slice(0, 8);
      }

      // ---------- Storage ----------

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.tracks)) {
              state.tracks = parsed.tracks.filter(function (t) {
                return t && !isDemoTrack(t) && (t.status === 'incoming' || t.status === 'queued' || t.status === 'failed');
              });
              state.tracks.forEach(function (t) {
                t.resolving = false;
                if (!t.titled && /^Fetching Suno Track/.test(String(t.title || ''))) {
                  t.title = placeholderTitle(t.songUuid);
                }
              });
              state.activeTab = (parsed.activeTab === 'queued' || parsed.activeTab === 'incoming' || parsed.activeTab === 'failed')
                ? parsed.activeTab
                : 'incoming';
              const np = parsed.nowPlaying;
              state.nowPlaying = (np && !isShortId(np.songUuid) && !isDemoTrack(np)) ? np : null;
            }
          }
        } catch (err) {
          // Ignore sandbox storage errors
        }
        try {
          resolveCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {};
        } catch (err) {
          resolveCache = {};
        }
      }

      function saveState() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              activeTab: state.activeTab,
              nowPlaying: state.nowPlaying,
              tracks: state.tracks
            })
          );
        } catch (err) {
          // Ignore sandbox storage errors
        }
      }

      function saveCache() {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(resolveCache));
        } catch (err) {
          // Ignore sandbox storage errors
        }
      }

      // ---------- UI helpers ----------

      function setStatus(msg, tone) {
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        if (statusText) statusText.textContent = msg;
        if (statusDot) {
          statusDot.className =
            'w-2 h-2 rounded-full shrink-0 ' +
            (tone === 'error'
              ? 'bg-rose-400'
              : tone === 'warn'
              ? 'bg-amber-400'
              : 'bg-emerald-400');
        }
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // ---------- Link parsing ----------

      // Extract Suno UUIDs or suno.com/s/ short links from any pasted string
      function parseAllSunoSubmissions(input) {
        if (!input) return [];
        const text = String(input);
        const found = [];
        const seen = {};

        const uuidGlobal = new RegExp('(' + UUID_SRC + ')', 'g');
        let m;
        while ((m = uuidGlobal.exec(text)) !== null) {
          const uuid = m[1].toLowerCase();
          if (!seen[uuid]) {
            seen[uuid] = true;
            found.push({
              kind: 'uuid',
              songUuid: uuid,
              originalUrl: 'https://suno.com/song/' + uuid
            });
          }
        }

        const shortGlobal = /https?:\/\/(?:www\.)?suno\.(?:com|ai)\/s\/([A-Za-z0-9_-]{4,32})/gi;
        while ((m = shortGlobal.exec(text)) !== null) {
          const code = m[1];
          const key = 'short-' + code;
          if (!seen[key]) {
            seen[key] = true;
            found.push({
              kind: 'shortlink',
              songUuid: key,
              originalUrl: 'https://suno.com/s/' + code
            });
          }
        }
        return found;
      }

      // Undo the escaping that hides song paths in lookup responses: JSON-escaped
      // slashes, HTML entities, and URL-encoded redirect targets
      // (suno.com/s/CODE bounces through /auth/session-recovery?...%2Fsong%2F<id>).
      function normalizeForIds(raw) {
        let s = String(raw || '')
          .replace(/\\u002[fF]/g, '/')
          .replace(/\\\//g, '/')
          .replace(/&#x2[fF];|&#47;/g, '/');
        for (let i = 0; i < 2; i++) {
          s = s
            .replace(/%25/g, '%')
            .replace(/%2[fF]/g, '/')
            .replace(/%3[aA]/g, ':')
            .replace(/%3[fF]/g, '?')
            .replace(/%3[dD]/g, '=')
            .replace(/%26/g, '&');
        }
        return s;
      }

      // Find the song's own ID in a lookup response. Prefers the page's own
      // og:url / canonical tag over any other song link on the page, then any
      // /song/ or /embed/ path (absolute or relative), then the audio file.
      function extractSongUuid(raw) {
        if (!raw) return null;
        const text = normalizeForIds(raw);
        const songRe = new RegExp('\\/(?:song|embed)\\/(' + UUID_SRC + ')', 'i');
        const tagPatterns = [
          /<meta[^>]+og:url[^>]*>/i,
          /<link[^>]+rel=["']canonical["'][^>]*>/i
        ];
        for (let i = 0; i < tagPatterns.length; i++) {
          const tag = text.match(tagPatterns[i]);
          if (tag) {
            const m = tag[0].match(songRe);
            if (m) return m[1].toLowerCase();
          }
        }
        const anySong = text.match(songRe);
        if (anySong) return anySong[1].toLowerCase();
        const audio = text.match(new RegExp('cdn\\d*\\.suno\\.ai\\/(' + UUID_SRC + ')\\.mp3', 'i'));
        if (audio) return audio[1].toLowerCase();
        // Never use the cover-image ID: Suno reuses artwork, so image_<id> can belong to a different song.
        return null;
      }

      function decodeEntities(s) {
        return String(s || '')
          .replace(/&amp;/g, '&')
          .replace(/&quot;/g, '"')
          .replace(/&#x27;|&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>');
      }

      function cleanTitle(s) {
        const t = decodeEntities(s).replace(/\s*\|\s*Suno.*$/i, '').trim();
        if (!t || /^suno(\s*[|\-–—:]|\s*$)/i.test(t)) return '';
        return t;
      }

      function extractTitle(text) {
        if (!text) return '';
        const m =
          text.match(/<meta[^>]+property=["']og:title["'][^>]*content=["']([^"']+)["']/i) ||
          text.match(/<meta[^>]+content=["']([^"']+)["'][^>]*property=["']og:title["']/i) ||
          text.match(/<title>([^<]+)<\/title>/i);
        return m ? m[1] : '';
      }

      // ---------- Lookups (one at a time, with timeouts) ----------

      function fetchWithTimeout(url) {
        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
        }, LOOKUP_TIMEOUT_MS);
        return fetch(url, ctrl ? { signal: ctrl.signal } : {}).finally(function () {
          clearTimeout(timer);
        });
      }

      async function runLookup(lookupUrl, needUuid) {
        const enc = encodeURIComponent(lookupUrl);
        const endpoints = [
          'https://api.microlink.io/?url=' + enc,
          'https://api.allorigins.win/get?url=' + enc,
          'https://corsproxy.io/?url=' + enc
        ];

        for (let i = 0; i < endpoints.length; i++) {
          try {
            const resp = await fetchWithTimeout(endpoints[i]);
            if (!resp.ok) continue;
            let body = await resp.text();
            let urlHint = '';
            let title = '';
            let author = '';

            try {
              const json = JSON.parse(body);
              if (json && json.data) {
                urlHint = json.data.url || '';
                title = json.data.title || '';
                author = json.data.author || '';
              }
              if (json && typeof json.contents === 'string') {
                body = json.contents;
                urlHint = (json.status && json.status.url) || '';
              }
            } catch (notJson) {}

            body = body.replace(/\\u002[fF]/g, '/').replace(/\\\//g, '/');
            const uuid = extractSongUuid(urlHint) || extractSongUuid(body);
            title = cleanTitle(title) || cleanTitle(extractTitle(body));

            if (needUuid && !uuid) continue;
            if (!needUuid && !title) continue;
            return { uuid: uuid, title: title, author: String(author || '').trim() };
          } catch (err) {
            // Timeout or network error: try next service
          }
        }
        return null;
      }

      function queueLookup(lookupUrl, needUuid) {
        const job = lookupChain.then(function () {
          return runLookup(lookupUrl, needUuid);
        });
        lookupChain = job.catch(function () {});
        return job;
      }

      // ---------- Resolution ----------

      function applyResolved(track, res) {
        if (res.uuid) {
          track.songUuid = res.uuid;
          track.originalUrl = 'https://suno.com/song/' + res.uuid;
        }
        if (res.title) {
          track.title = res.title;
          track.titled = true;
        } else if (!track.titled) {
          track.title = placeholderTitle(track.songUuid);
        }
        if (res.author && (!track.artist || track.artist === DEFAULT_ARTIST)) {
          track.artist = res.author;
        }
      }

      // Short link -> real song ID. Returns true when the track is playable.
      function resolveShortTrack(track) {
        if (!track || !isShortId(track.songUuid)) return Promise.resolve(true);
        if (pendingResolves[track.id]) return pendingResolves[track.id];

        const code = track.songUuid.slice(6);
        const cached = resolveCache['s:' + code];
        if (cached && cached.uuid) {
          applyResolved(track, cached);
          saveState();
          renderQueue();
          return Promise.resolve(true);
        }

        track.resolving = true;
        track.lastAttempt = Date.now();
        track.attempts = (track.attempts || 0) + 1;
        renderQueue();
        setStatus('Looking up ' + track.title + '…', 'warn');

        const job = queueLookup(track.originalUrl, true).then(function (res) {
          track.resolving = false;
          delete pendingResolves[track.id];
          if (res && res.uuid) {
            resolveCache['s:' + code] = res;
            saveCache();
            applyResolved(track, res);
            saveState();
            renderQueue();
            if (!track.titled) fetchTitle(track);
            return true;
          }
          saveState();
          renderQueue();
          return false;
        });
        pendingResolves[track.id] = job;
        return job;
      }

      // Full song link: only fetch the title. Never changes the song ID.
      function fetchTitle(track) {
        if (!track || isShortId(track.songUuid) || track.titled) return;
        if (pendingResolves[track.id]) return;

        const cached = resolveCache['t:' + track.songUuid];
        if (cached && cached.title) {
          applyResolved(track, { title: cached.title, author: cached.author });
          syncNowPlayingMeta(track);
          saveState();
          renderQueue();
          return;
        }

        track.resolving = true;
        renderQueue();
        const job = queueLookup('https://suno.com/song/' + track.songUuid, false).then(function (res) {
          track.resolving = false;
          delete pendingResolves[track.id];
          if (res && res.title) {
            resolveCache['t:' + track.songUuid] = { title: res.title, author: res.author };
            saveCache();
            applyResolved(track, { title: res.title, author: res.author });
          }
          syncNowPlayingMeta(track);
          saveState();
          renderQueue();
          return true;
        });
        pendingResolves[track.id] = job;
      }

      function syncNowPlayingMeta(track) {
        if (state.nowPlaying && state.nowPlaying.id === track.id) {
          state.nowPlaying.title = track.title;
          state.nowPlaying.artist = track.artist;
          renderNowPlayingMeta();
        }
      }

      // ---------- Player ----------

      // Mount track into persistent top iframe ONLY on explicit play/next commands.
      // Only ever called with a real song ID.
      function mountTrackIntoIframe(track, forceReload) {
        if (!track || isShortId(track.songUuid)) return;
        const iframe = document.getElementById('sunoEmbedFrame');
        const placeholder = document.getElementById('iframePlaceholder');

        if (placeholder) {
          placeholder.classList.add('hidden');
        }

        const embedUrl = 'https://suno.com/embed/' + track.songUuid;
        if (forceReload || state.lastMountedUuid !== track.songUuid) {
          iframe.src = embedUrl;
          state.lastMountedUuid = track.songUuid;
        }

        state.nowPlaying = {
          id: track.id,
          songUuid: track.songUuid,
          title: track.title,
          artist: track.artist,
          originalUrl: track.originalUrl
        };

        renderNowPlayingMeta();
      }

      function renderNowPlayingMeta() {
        const titleEl = document.getElementById('npTitle');
        const artistEl = document.getElementById('npArtist');
        const linkEl = document.getElementById('npExternalLink');

        if (!state.nowPlaying) {
          titleEl.textContent = 'No Track Loaded';
          artistEl.textContent = 'Approve a song to Playlist, then tap Next Track';
          linkEl.href = 'https://suno.com';
          return;
        }

        titleEl.textContent = state.nowPlaying.title;
        artistEl.textContent = state.nowPlaying.artist || DEFAULT_ARTIST;
        linkEl.href = state.nowPlaying.originalUrl || ('https://suno.com/song/' + state.nowPlaying.songUuid);
      }

      // Resolve first, then swap. If the link can't be resolved, the current
      // song, its label, and the queue stay exactly as they were.
      async function playTrack(track) {
        if (isShortId(track.songUuid)) {
          setStatus('Resolving "' + track.title + '" before playing…', 'warn');
          const ok = await resolveShortTrack(track);
          if (state.tracks.indexOf(track) === -1) return false;
          if (!ok) {
            track.status = 'failed';
            saveState();
            renderQueue();
            setStatus('Could not resolve "' + track.title + '" — moved to Failed', 'error');
            return false;
          }
        }

        if (state.nowPlaying) {
          const prevIdx = state.tracks.findIndex(function (t) {
            return t.id === state.nowPlaying.id;
          });
          if (prevIdx !== -1 && state.tracks[prevIdx] !== track && state.tracks[prevIdx].status === 'playing') {
            state.tracks.splice(prevIdx, 1);
          }
        }

        track.status = 'playing';
        mountTrackIntoIframe(track, false);
        saveState();
        renderQueue();
        setStatus('Playing: ' + track.title, 'info');
        if (!track.titled) fetchTitle(track);
        return true;
      }

      function runTransport(fn) {
        if (transportBusy) {
          setStatus('Still loading the last request…', 'warn');
          return;
        }
        transportBusy = true;
        Promise.resolve()
          .then(fn)
          .catch(function () {})
          .then(function () {
            transportBusy = false;
          });
      }

      // Play the first playable song in Playlist, skipping links that fail.
      async function advanceToNextQueued() {
        let next;
        let skipped = 0;
        while ((next = state.tracks.find(function (t) { return t.status === 'queued'; }))) {
          const ok = await playTrack(next);
          if (ok) {
            if (skipped) setStatus('Playing: ' + next.title + ' (skipped ' + skipped + ' failed)', 'warn');
            return;
          }
          skipped += 1;
        }
        if (state.nowPlaying) {
          setStatus(skipped ? 'No playable links left — current song keeps playing' : 'Playlist is empty — current song keeps playing', 'warn');
        } else {
          setStatus('Playlist is empty — approve a track from Pending first', 'warn');
          state.activeTab = 'incoming';
          renderQueue();
        }
      }

      // ---------- Queue rendering ----------

      function renderQueue() {
        const counts = {
          incoming: 0,
          queued: 0,
          failed: 0
        };

        state.tracks.forEach(function (t) {
          if (t.status === 'incoming') counts.incoming += 1;
          else if (t.status === 'queued') counts.queued += 1;
          else if (t.status === 'failed') counts.failed += 1;
        });

        document.getElementById('countIncoming').textContent = String(counts.incoming);
        document.getElementById('countQueued').textContent = String(counts.queued);
        document.getElementById('countFailed').textContent = String(counts.failed);

        const failedToolbar = document.getElementById('failedToolbar');
        if (failedToolbar) {
          if (state.activeTab === 'failed' && counts.failed > 0) {
            failedToolbar.classList.remove('hidden');
          } else {
            failedToolbar.classList.add('hidden');
          }
        }

        // Highlight active tab; tint Failed red whenever it has items
        document.querySelectorAll('.queue-tab').forEach(function (btn) {
          const tab = btn.getAttribute('data-tab');
          if (tab === state.activeTab) {
            const activeColor =
              tab === 'incoming'
                ? 'bg-sky-500/20 text-sky-300 border-sky-500/50'
                : tab === 'queued'
                ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50'
                : 'bg-rose-500/20 text-rose-300 border-rose-500/50';
            btn.className = 'queue-tab flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-bold border transition ' + activeColor;
          } else {
            const idleText = tab === 'failed' && counts.failed > 0 ? 'text-rose-300' : 'text-slate-400';
            btn.className = 'queue-tab flex items-center justify-between px-2.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 border border-slate-800 hover:border-slate-700 transition ' + idleText;
          }
        });

        const container = document.getElementById('queueListContainer');
        container.innerHTML = '';

        const filtered = state.tracks.filter(function (t) {
          return t.status === state.activeTab;
        });

        if (filtered.length === 0) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'rounded-xl bg-slate-950/60 border border-dashed border-slate-800 p-6 text-center text-xs text-slate-400';
          emptyDiv.textContent =
            state.activeTab === 'incoming'
              ? 'No pending links. Paste a Suno link above and tap Fetch and Submit.'
              : state.activeTab === 'queued'
              ? 'Playlist is empty. Approve songs from Pending using Play Next or Add Queue.'
              : 'No failed tracks.';
          container.appendChild(emptyDiv);
          return;
        }

        filtered.forEach(function (track, idx) {
          const card = document.createElement('div');
          card.className = 'rounded-xl bg-slate-950 border border-slate-800 p-2.5 flex flex-col gap-2';

          const badge =
            track.status === 'queued'
              ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">' + (track.resolving ? 'LOOKUP…' : '#' + (idx + 1)) + '</span>'
              : track.status === 'incoming'
              ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-500/15 text-sky-300 border border-sky-500/30">' + (track.resolving ? 'FETCHING…' : 'PENDING') + '</span>'
              : '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">' + (track.resolving ? 'RETRYING…' : 'FAILED') + '</span>';

          const topRow =
            '<div class="flex items-center justify-between gap-2 min-w-0">' +
              '<div class="flex items-center gap-2 min-w-0">' +
                badge +
                '<span class="text-xs sm:text-sm font-bold text-white truncate">' + escapeHtml(track.title) + '</span>' +
              '</div>' +
              '<span class="text-[11px] text-slate-400 shrink-0 truncate max-w-[110px]">' + escapeHtml(track.artist) + '</span>' +
            '</div>';

          let actionsRow = '<div class="flex items-center justify-between gap-1.5 pt-0.5">';

          if (track.status === 'incoming') {
            actionsRow +=
              '<div class="flex items-center gap-1.5 flex-1">' +
                '<button type="button" data-action="add-play-next" data-id="' + track.id + '" class="flex-1 py-2 px-2.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold transition">⚡ Play Next</button>' +
                '<button type="button" data-action="add-queue" data-id="' + track.id + '" class="flex-1 py-2 px-2.5 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 text-xs font-bold border border-sky-500/40 transition">+ Add Queue</button>' +
              '</div>' +
              '<button type="button" data-action="remove" data-id="' + track.id + '" class="py-2 px-2.5 rounded-lg bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 text-xs font-bold border border-slate-800">✕</button>';
          } else if (track.status === 'queued') {
            actionsRow +=
              '<div class="flex items-center gap-1.5">' +
                '<button type="button" data-action="move-up" data-id="' + track.id + '" class="py-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">↑</button>' +
                '<button type="button" data-action="move-down" data-id="' + track.id + '" class="py-1.5 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">↓</button>' +
                '<button type="button" data-action="play-now" data-id="' + track.id + '" class="py-1.5 px-3 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-xs font-bold text-emerald-300 border border-emerald-500/40">▶ Play Now</button>' +
              '</div>' +
              '<button type="button" data-action="remove" data-id="' + track.id + '" class="py-1.5 px-2.5 rounded-lg bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 text-xs font-bold border border-slate-800">✕</button>';
          } else {
            // Failed tab: unresolved short links get Open ↗ for the manual fix;
            // real song IDs (marked failed during playback) can go straight back to the queue.
            const secondary = isShortId(track.songUuid)
              ? '<a href="' + escapeHtml(track.originalUrl) + '" target="_blank" rel="noopener noreferrer" class="py-2 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700">Open ↗</a>'
              : '<button type="button" data-action="add-queue" data-id="' + track.id + '" class="py-2 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700">To Queue</button>';
            actionsRow +=
              '<div class="flex items-center gap-1.5 flex-1">' +
                '<button type="button" data-action="retry-failed" data-id="' + track.id + '" class="flex-1 py-2 px-3 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition">↻ Retry</button>' +
                secondary +
              '</div>' +
              '<button type="button" data-action="remove" data-id="' + track.id + '" class="py-2 px-2.5 rounded-lg bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-300 text-xs font-bold border border-slate-800">✕</button>';
          }

          actionsRow += '</div>';
          card.innerHTML = topRow + actionsRow;
          container.appendChild(card);
        });
      }

      // ---------- Actions ----------

      // Retry a failed link. Short links are looked up again (with a cooldown so
      // repeated taps don't burn the free lookup services); real song IDs go back to Pending.
      function retryTrack(track) {
        if (track.resolving) return Promise.resolve(false);
        if (track.lastAttempt && Date.now() - track.lastAttempt < RETRY_COOLDOWN_MS) {
          setStatus('Wait ~20 seconds before retrying that link', 'warn');
          return Promise.resolve(false);
        }
        if (!isShortId(track.songUuid)) {
          track.status = 'incoming';
          saveState();
          renderQueue();
          setStatus('Moved "' + track.title + '" back to Pending', 'info');
          return Promise.resolve(true);
        }
        return resolveShortTrack(track).then(function (ok) {
          if (ok && track.status === 'failed') {
            track.status = 'incoming';
            setStatus('Resolved: ' + track.title + ' — back in Pending', 'info');
          } else if (!ok) {
            setStatus('Still failing — use Open ↗ and paste the full link', 'error');
          }
          saveState();
          renderQueue();
          return ok;
        });
      }

      function handleQueueAction(action, trackId) {
        const index = state.tracks.findIndex(function (t) {
          return t.id === trackId;
        });
        if (index === -1) return;
        const track = state.tracks[index];

        if (action === 'add-play-next') {
          // Approve and place at #1 top of Playlist ('queued')
          track.status = 'queued';
          state.tracks.splice(index, 1);
          const firstQueuedIdx = state.tracks.findIndex(function (t) {
            return t.status === 'queued';
          });
          if (firstQueuedIdx === -1) {
            state.tracks.push(track);
          } else {
            state.tracks.splice(firstQueuedIdx, 0, track);
          }
          saveState();
          renderQueue();
          setStatus('Added "' + track.title + '" to #1 Play Next', 'info');
        } else if (action === 'add-queue') {
          // Approve and send to the END of Playlist ('queued')
          track.status = 'queued';
          state.tracks.splice(index, 1);
          state.tracks.push(track);
          saveState();
          renderQueue();
          setStatus('Added "' + track.title + '" to end of Playlist', 'info');
        } else if (action === 'move-up' || action === 'move-down') {
          const queuedIndices = [];
          state.tracks.forEach(function (t, i) {
            if (t.status === 'queued') queuedIndices.push(i);
          });
          const pos = queuedIndices.indexOf(index);
          if (pos === -1) return;
          const swapPos = action === 'move-up' ? pos - 1 : pos + 1;
          if (swapPos < 0 || swapPos >= queuedIndices.length) return;
          const targetIndex = queuedIndices[swapPos];
          const temp = state.tracks[index];
          state.tracks[index] = state.tracks[targetIndex];
          state.tracks[targetIndex] = temp;
          saveState();
          renderQueue();
          setStatus('Updated Playlist order', 'info');
        } else if (action === 'play-now') {
          runTransport(function () {
            return playTrack(track);
          });
        } else if (action === 'retry-failed') {
          retryTrack(track);
        } else if (action === 'remove') {
          state.tracks.splice(index, 1);
          saveState();
          renderQueue();
          setStatus('Removed track', 'info');
        }
      }

      // Fetch and Submit handler -> drops into Pending Approval ('incoming')
      function handleFetchAndSubmit() {
        const urlInput = document.getElementById('inputSunoUrl');
        const artistInput = document.getElementById('inputArtistName');

        const rawUrl = urlInput.value.trim();
        const items = parseAllSunoSubmissions(rawUrl);

        if (items.length === 0) {
          setStatus('Paste a valid Suno song or short link first', 'error');
          return;
        }

        const artist = artistInput.value.trim() || DEFAULT_ARTIST;
        const added = [];

        items.forEach(function (parsed, idx) {
          const newTrack = {
            id: 'trk_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
            songUuid: parsed.songUuid,
            title: placeholderTitle(parsed.songUuid),
            artist: artist,
            originalUrl: parsed.originalUrl,
            status: 'incoming',
            resolving: false
          };
          state.tracks.push(newTrack);
          added.push(newTrack);
        });

        state.activeTab = 'incoming';
        urlInput.value = '';
        artistInput.value = '';
        saveState();
        renderQueue();
        setStatus('Added ' + added.length + ' link(s) to Pending', 'info');

        added.forEach(function (t) {
          if (isShortId(t.songUuid)) {
            resolveShortTrack(t).then(function (ok) {
              if (ok) {
                setStatus('Ready: ' + t.title, 'info');
              } else if (t.status === 'incoming' || t.status === 'queued') {
                t.status = 'failed';
                saveState();
                renderQueue();
                setStatus('Could not look up ' + t.originalUrl + ' — see Failed tab', 'error');
              }
            });
          } else {
            fetchTitle(t);
          }
        });
      }

      window.addEventListener('DOMContentLoaded', function () {
        loadState();

        document.getElementById('btnMountFirstTrack').addEventListener('click', function () {
          runTransport(advanceToNextQueued);
        });

        document.getElementById('btnAdvanceNext').addEventListener('click', function () {
          runTransport(advanceToNextQueued);
        });

        document.getElementById('btnReloadCurrent').addEventListener('click', function () {
          if (!state.nowPlaying) {
            setStatus('No active track to reload', 'warn');
            return;
          }
          mountTrackIntoIframe(state.nowPlaying, true);
          setStatus('Reloaded current player', 'info');
        });

        document.getElementById('btnMarkFailed').addEventListener('click', function () {
          if (!state.nowPlaying) {
            setStatus('No active track to mark failed', 'warn');
            return;
          }
          const matched = state.tracks.find(function (t) {
            return t.id === state.nowPlaying.id;
          });
          if (matched) {
            matched.status = 'failed';
          } else {
            state.tracks.push({
              id: state.nowPlaying.id || ('trk_failed_' + Date.now()),
              songUuid: state.nowPlaying.songUuid,
              title: state.nowPlaying.title,
              artist: state.nowPlaying.artist,
              originalUrl: state.nowPlaying.originalUrl,
              status: 'failed',
              titled: true
            });
          }
          saveState();
          renderQueue();
          setStatus('Sent "' + state.nowPlaying.title + '" to Failed tab', 'error');
          runTransport(advanceToNextQueued);
        });

        document.getElementById('btnRetryAllFailed').addEventListener('click', function () {
          const failedList = state.tracks.filter(function (t) {
            return t.status === 'failed';
          });
          if (failedList.length === 0) return;
          setStatus('Retrying ' + failedList.length + ' link(s) one at a time…', 'warn');
          failedList.forEach(function (t) {
            retryTrack(t);
          });
        });

        document.getElementById('addLinkForm').addEventListener('submit', function (e) {
          e.preventDefault();
          handleFetchAndSubmit();
        });

        document.querySelectorAll('.queue-tab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.activeTab = btn.getAttribute('data-tab') || 'incoming';
            saveState();
            renderQueue();
          });
        });

        document.getElementById('queueListContainer').addEventListener('click', function (e) {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');
          const id = btn.getAttribute('data-id');
          if (action && id) {
            handleQueueAction(action, id);
          }
        });

        if (state.nowPlaying) {
          mountTrackIntoIframe(state.nowPlaying, true);
        } else {
          renderNowPlayingMeta();
        }
        renderQueue();
      });
    })();
  </script>
</body>
</html>
